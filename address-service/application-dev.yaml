spring:
  application:
    name: address-service
  datasource:
    url: jdbc:mysql://localhost:3306/msdb
    username: root
    password: Amma@1994
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto : update
    show-sql: true
    properties:
      hibernate:
        format_sql : true
server:
  port: 8081
  servlet:
    context-path: /address_app/api

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    refresh:
      enable: false
  instance:
      hostname: localhost
      instance-id: ${spring.application.name}:${server.port}
      prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
